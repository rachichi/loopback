<!doctype html>
<html lang="en">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="%BASE_URL%loopback_logo.png" />
    <title>Loopback</title>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <!-- Netlify Forms reads this at build time to learn the landing page's contact form (src/features/landing).
         The page itself submits it with fetch; this copy is never shown. -->
    <form name="contact" data-netlify="true" netlify-honeypot="website" hidden>
      <input name="email" />
      <textarea name="details"></textarea>
      <input name="website" />
    </form>
    <!-- The same for the portal footer's feedback form (src/features/feedback). -->
    <form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="kind" />
      <textarea name="message"></textarea>
      <input name="board" />
      <input name="page" />
      <input name="from" />
      <input name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
