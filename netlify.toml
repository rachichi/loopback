[build]
# Netlify restores node_modules from its build cache, and a stale or partial copy makes pnpm skip the
# install ("Lockfile is up to date") and the build fail on missing files. --force relinks every package
# from the lockfile, so cached builds behave like "Clear cache and deploy".
command = "pnpm install --frozen-lockfile --force && pnpm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

# The Supabase URL and publishable key, and the Google Analytics measurement id, are built into the site
# on purpose (the browser needs them; row-level security controls data access), so the secrets scan
# shouldn't fail the build over them.
SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_GA_MEASUREMENT_ID"

# Single-page app: paths such as /share/<token> are handled in the browser, so serve index.html for
# anything that isn't a built file. Netlify serves existing files first, so assets are unaffected.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
